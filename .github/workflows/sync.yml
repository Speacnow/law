name: 同步法律法规

on:
  schedule:
    # UTC 时间。每天 22:00 UTC = 北京时间次日 06:00
    - cron: "0 22 * * *"
  # 允许在网页 / Actions 页面手动触发（Cloudflare Worker 也调这个）
  workflow_dispatch:

permissions:
  contents: write          # 需要 push 回仓库

concurrency:
  group: law-sync          # 同一时间只跑一个
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 同步目录与正文
        run: python tools/sync.py --once

      - name: 心跳（每月一次，避免 60 天无提交被暂停定时任务）
        run: python tools/heartbeat.py

      - name: 有变化才提交
        run: |
          git config user.name  "law-sync-bot"
          git config user.email "law-sync-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "本次无变化，跳过提交"
            exit 0
          fi
          # 只有心跳文件变化时，提交信息写明是心跳
          if git diff --cached --name-only | grep -qv '^data/heartbeat\.json$'; then
            msg="chore: 同步法律法规 $(date -u +%F)"
          else
            msg="chore: 心跳 $(date -u +%F)"
          fi
          git commit -m "$msg"
          git push
